name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

# This repository is public. A public repository cannot call the reusable
# workflows in the private solidafy/.github, does not receive the
# organisation's GITLEAKS_LICENSE secret that gitleaks-action needs, and is not
# served by the organisation's runner groups. So the scan runs the gitleaks
# CLI, which needs no license, on GitHub's hosted runners, and SAST runs the
# scanners of reusable-sast.yaml in solidafy/.github inline.
env:
  GITLEAKS_VERSION: 8.30.1
  # From gitleaks_8.30.1_checksums.txt of the same release.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # The version and digest reusable-sast.yaml pins; bump them together with it.
  ZIZMOR_VERSION: v1.30.1
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

jobs:
  secret-scan:
    # gitleaks, per compliance procedure PROC-SS-001.
    name: Secret Scan
    runs-on: ubuntu-latest
    # Branch Protection gates merges on this, so a hang would block every merge
    # until GitHub's 6-hour default fires. A scan of this history takes seconds.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan never pushes, and it walks the pull request's own commits,
          # so it needs neither a usable credential nor a shallow clone.
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # The release's checksums file must still name the pinned hash, and
          # the download must match it.
          grep -Fqx "${GITLEAKS_SHA256}  ${asset}" checksums.txt
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum --check --strict
          tar -xzf "$asset" gitleaks
          echo "$dir" >>"$GITHUB_PATH"

      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan the current files
        run: gitleaks dir --redact --verbose .

  sast:
    # Finding M6. The repository holds only GitHub Actions workflows, so of the
    # shared workflow's scanners only zizmor applies. It fails on a high
    # finding, the shared workflow's threshold, but on any such finding in the
    # repository rather than only on new ones.
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          asset="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          dir="$RUNNER_TEMP/zizmor"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 -o "$asset" "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/${asset}"
          echo "${ZIZMOR_SHA256}  ${asset}" | sha256sum --check --strict
          tar -xzf "$asset" zizmor
          echo "$dir" >>"$GITHUB_PATH"

      - name: zizmor scan
        env:
          # Online audits (known-vulnerable actions, impostor commits) read
          # public action repositories through the API.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity high .

  # The single required status check next to Solidafy Code Review. It lists
  # every other job, and reads their results directly: at step level
  # `failure()` only sees this job's own earlier steps, of which there are none.
  branch-protection:
    name: Branch Protection
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - sast
    if: always()
    permissions: {}
    steps:
      # success passes, skipped passes, failure fails, cancelled fails.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Branch protection failed: needs results = ${{ join(needs.*.result, ', ') }}"
          exit 1
